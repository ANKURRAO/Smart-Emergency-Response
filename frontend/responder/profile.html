<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responder Profile | Smart Emergency Response</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            max-width: 700px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        input:disabled {
            background: #f1f5f9;
        }

        .role {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        button {
            border: none;
            padding: 12px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .save {
            width: 100%;
            background: #2563eb;
            color: white;
            margin-top: 25px;
        }

        .back {
            background: #475569;
            color: white;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>

    <strong>
        🚑 Responder Profile
    </strong>

    <button
        class="back"
        onclick="location.href='dashboard.html'">

        Dashboard

    </button>

</header>


<main>

    <section class="box">

        <h1>
            Responder Profile
        </h1>

        <p>
            Manage your responder information.
        </p>

        <br>

        <span class="role">
            RESPONDER
        </span>


        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
            disabled>


        <label for="name">
            Full Name
        </label>

        <input
            id="name"
            type="text"
            maxlength="100"
            placeholder="Enter full name">


        <label for="phone">
            Phone Number
        </label>

        <input
            id="phone"
            type="tel"
            maxlength="15"
            placeholder="Enter phone number">


        <label for="department">
            Department
        </label>

        <select id="department">

            <option value="">
                Select Department
            </option>

            <option value="Medical">
                Medical / Ambulance
            </option>

            <option value="Fire">
                Fire & Rescue
            </option>

            <option value="Police">
                Police / Security
            </option>

            <option value="Disaster Management">
                Disaster Management
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label for="vehicle">
            Vehicle / Unit Number
        </label>

        <input
            id="vehicle"
            type="text"
            maxlength="50"
            placeholder="Example: Ambulance UP32-1234">


        <button
            class="save"
            id="saveBtn">

            Save Profile

        </button>


        <div id="message"></div>

    </section>

</main>


<script type="module">

import { auth, db } from "../firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    ref,
    get,
    update
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


let currentUser = null;


/* ================= AUTH ================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        location.href = "../index.html";
        return;

    }

    currentUser = user;


    try {

        const snapshot =
            await get(
                ref(
                    db,
                    "users/" +
                    user.uid
                )
            );


        if (
            !snapshot.exists() ||
            snapshot.val().role !== "responder"
        ) {

            alert("Responder access required.");

            location.href =
                "../index.html";

            return;

        }


        const data =
            snapshot.val();


        document.getElementById("email")
            .value =
            user.email;


        document.getElementById("name")
            .value =
            data.name || "";


        document.getElementById("phone")
            .value =
            data.phone || "";


        document.getElementById("department")
            .value =
            data.department || "";


        document.getElementById("vehicle")
            .value =
            data.vehicle || "";


    } catch (error) {

        console.error(error);

    }

});


/* ================= SAVE ================= */

document.getElementById("saveBtn")
.addEventListener("click", async () => {

    if (!currentUser) return;


    const name =
        document.getElementById("name")
            .value.trim();


    const phone =
        document.getElementById("phone")
            .value.trim();


    const department =
        document.getElementById("department")
            .value;


    const vehicle =
        document.getElementById("vehicle")
            .value.trim();


    const message =
        document.getElementById("message");


    if (!name) {

        message.style.color =
            "red";

        message.textContent =
            "Please enter your name.";

        return;

    }


    const button =
        document.getElementById("saveBtn");


    button.disabled = true;

    button.textContent =
        "Saving...";


    try {

        await update(
            ref(
                db,
                "users/" +
                currentUser.uid
            ),
            {

                name: name,

                phone: phone,

                department:
                    department,

                vehicle:
                    vehicle,

                profileUpdatedAt:
                    new Date().toISOString()

            }
        );


        message.style.color =
            "green";

        message.textContent =
            "✅ Profile updated successfully.";

    } catch (error) {

        console.error(error);

        message.style.color =
            "red";

        message.textContent =
            "❌ Unable to update profile.";

    }


    button.disabled = false;

    button.textContent =
        "Save Profile";

});

</script>

</body>
</html>
