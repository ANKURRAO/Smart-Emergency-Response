

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Incidents | Smart Emergency Response</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        .top {
            margin-bottom: 25px;
        }

        .top p {
            color: #64748b;
        }

        .incident {
            background: white;
            padding: 22px;
            margin-bottom: 16px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        .incident-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .critical {
            background: #fee2e2;
            color: #b91c1c;
        }

        .details {
            margin-top: 15px;
            line-height: 1.7;
            color: #475569;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .track {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #475569;
            color: white;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <strong>🚨 Smart Emergency Response</strong>

    <button class="back" onclick="location.href='dashboard.html'">
        Dashboard
    </button>
</header>

<main>
    <section class="top">
        <h1>My Emergency Reports</h1>
        <p>View and track all emergencies reported from your account.</p>
    </section>

    <section id="incidentList">
        Loading incidents...
    </section>
</main>

<script type="module">

import { auth, db } from "../firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    ref,
    get,
    query,
    orderByChild,
    equalTo
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


// =================================================
// AUTHENTICATION
// =================================================

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        location.href = "../index.html";
        return;
    }

    await loadIncidents(user);

});


// =================================================
// LOAD CITIZEN INCIDENTS
// =================================================

async function loadIncidents(currentUser) {

    const container = document.getElementById("incidentList");

    container.textContent = "Loading incidents...";

    try {

        const incidentsQuery = query(
            ref(db, "incidents"),
            orderByChild("citizenId"),
            equalTo(currentUser.uid)
        );

        const snapshot = await get(incidentsQuery);

        if (!snapshot.exists()) {

            container.innerHTML = `
                <div class="empty">
                    <h2>No emergency reports</h2>

                    <p>
                        You have not reported any emergency yet.
                    </p>

                    <br>

                    <button class="track" id="reportButton">
                        Report Emergency
                    </button>
                </div>
            `;

            document
                .getElementById("reportButton")
                .addEventListener("click", () => {
                    location.href = "report.html";
                });

            return;
        }

        const incidents = [];

        snapshot.forEach(child => {

            incidents.push({
                id: child.key,
                ...child.val()
            });

        });

        // Sort newest incidents first.
        incidents.sort((a, b) => {
            return getTimestamp(b.createdAt) -
                   getTimestamp(a.createdAt);
        });

        container.innerHTML = "";

        incidents.forEach(incident => {

            const article = document.createElement("article");

            article.className = "incident";

            const severity = String(
                incident.severity || "unknown"
            ).toLowerCase();

            const severityClass =
                severity === "critical" ? "critical" : "";

            const status = String(
                incident.status || "reported"
            )
                .replaceAll("_", " ")
                .replaceAll("-", " ");

            article.innerHTML = `

                <div class="incident-header">

                    <div>
                        <h2>
                            ${escapeHTML(
                                incident.category ||
                                incident.type ||
                                "Emergency"
                            )}
                        </h2>

                        <small>
                            ID: ${escapeHTML(incident.incidentId || incident.id)}
                        </small>
                    </div>

                    <span class="status ${severityClass}">
                        ${escapeHTML(status)}
                    </span>

                </div>

                <div class="details">

                    <strong>Severity:</strong>
                    ${escapeHTML(incident.severity || "Unknown")}

                    <br>

                    <strong>Description:</strong>
                    ${escapeHTML(incident.description || "N/A")}

                    <br>

                    <strong>Reported:</strong>
                    ${formatDate(incident.createdAt)}

                    <br>

                    <strong>Responder:</strong>
                    ${escapeHTML(
                        incident.responderName ||
                        "Not assigned yet"
                    )}

                </div>

                <br>
            `;

            const trackButton = document.createElement("button");

            trackButton.className = "track";
            trackButton.textContent = "📍 Track Incident";

            trackButton.addEventListener("click", () => {

                location.href =
                    "tracking.html?id=" +
                    encodeURIComponent(incident.id);

            });

            article.appendChild(trackButton);
            container.appendChild(article);

        });

    } catch (error) {

        console.error("Incident loading error:", error);

        container.innerHTML = `
            <div class="error">
                <strong>Unable to load incidents.</strong>
                <p>${escapeHTML(error.message)}</p>
                <p>Please check Firebase Database permissions and indexing.</p>
            </div>
        `;

    }

}


// =================================================
// TIMESTAMP HELPER
// =================================================

function getTimestamp(value) {

    if (!value) {
        return 0;
    }

    // Supports both numeric and ISO date timestamps.
    const timestamp = new Date(value).getTime();

    return Number.isNaN(timestamp) ? 0 : timestamp;

}


// =================================================
// FORMAT DATE
// =================================================

function formatDate(value) {

    const timestamp = getTimestamp(value);

    if (!timestamp) {
        return "Unknown";
    }

    return new Date(timestamp).toLocaleString();

}


// =================================================
// HTML ESCAPE
// =================================================

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
