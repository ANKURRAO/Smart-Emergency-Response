
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Incident Details | Admin</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #0f172a;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

.details {
    line-height: 1.9;
    color: #475569;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

select, button {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
}

select {
    min-width: 220px;
    max-width: 100%;
}

.assign {
    background: #2563eb;
    color: white;
    border: 0;
    cursor: pointer;
    font-weight: bold;
}

.assign:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.back {
    background: #475569;
    color: white;
    border: 0;
    cursor: pointer;
    font-weight: bold;
}

.status {
    padding: 6px 12px;
    border-radius: 20px;
    background: #dbeafe;
    color: #1d4ed8;
    font-weight: bold;
}

#message {
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.5;
}

@media(max-width:700px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <strong>🛡️ Incident Control</strong>

    <button class="back"
        onclick="location.href='incidents.html'">
        Back
    </button>
</header>

<main>

    <section class="box">

        <h1 id="title">Loading Incident...</h1>

        <p>
            Incident ID:
            <strong id="incidentId"></strong>
        </p>

        <span id="status" class="status">
            Loading...
        </span>

    </section>

    <section class="box">

        <h2>Emergency Information</h2>

        <div id="details" class="details">
            Loading...
        </div>

    </section>

    <section class="grid">

        <section class="box">

            <h2>Responder Assignment</h2>

            <p>
                Select an available responder for this emergency.
            </p>

            <select id="responderSelect">
                <option value="">Loading responders...</option>
            </select>

            <br><br>

            <button class="assign" id="assignBtn">
                Assign Responder
            </button>

            <div id="message"></div>

        </section>

        <section class="box">

            <h2>Current Responder</h2>

            <div id="currentResponder">
                No responder assigned.
            </div>

        </section>

    </section>

    <section class="box">

        <h2>Emergency Location</h2>

        <div id="location">
            Loading...
        </div>

        <br>

        <button class="assign" id="mapBtn">
            Open Location
        </button>

    </section>

</main>

<script type="module">

// Firebase configuration
import { auth, db } from "../firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    ref,
    get,
    onValue
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


// Backend API
const API_BASE_URL = "http://localhost:5000/api";

let currentUser = null;
let incident = null;
let responders = [];

const params = new URLSearchParams(location.search);
const incidentId = params.get("id");

const responderSelect =
    document.getElementById("responderSelect");

const assignBtn =
    document.getElementById("assignBtn");

const message =
    document.getElementById("message");


// Check incident ID
if (!incidentId) {
    alert("Incident ID missing.");
    location.href = "incidents.html";
}


// Admin authentication
onAuthStateChanged(auth, async (user) => {

    if (!user) {
        location.href = "../index.html";
        return;
    }

    try {

        currentUser = user;

        const profile = await get(
            ref(db, "users/" + user.uid)
        );

        if (
            !profile.exists() ||
            profile.val().role !== "admin"
        ) {
            alert("Admin access required.");
            location.href = "../index.html";
            return;
        }

        loadIncident();
        loadResponders();

    } catch (error) {

        console.error("Authentication error:", error);

        alert("Unable to verify admin account.");

    }

});


// ------------------------------------
// INCIDENT DETAILS
// ------------------------------------

function loadIncident() {

    onValue(
        ref(db, "incidents/" + incidentId),

        (snapshot) => {

            if (!snapshot.exists()) {

                alert("Incident not found.");
                location.href = "incidents.html";
                return;

            }

            incident = snapshot.val();

            renderIncident();

        },

        (error) => {

            console.error("Incident loading error:", error);

            document.getElementById("details").textContent =
                "Unable to load incident details.";

        }
    );

}


function renderIncident() {

    document.getElementById("title").textContent =
        incident.type || "Emergency";

    document.getElementById("incidentId").textContent =
        incidentId;

    document.getElementById("status").textContent =
        incident.status || "Reported";


    document.getElementById("details").innerHTML = `

        <strong>Category:</strong>
        ${escapeHTML(incident.category || "Emergency")}

        <br>

        <strong>Severity:</strong>
        ${escapeHTML(incident.severity || "Unknown")}

        <br>

        <strong>Priority:</strong>
        ${escapeHTML(incident.priority || "Normal")}

        <br>

        <strong>Description:</strong>
        ${escapeHTML(incident.description || "N/A")}

        <br>

        <strong>Citizen:</strong>
        ${escapeHTML(incident.userEmail || "Unknown")}

        <br>

        <strong>Landmark:</strong>
        ${escapeHTML(incident.landmark || "Not provided")}

        <br>

        <strong>Reported:</strong>
        ${formatDate(incident.createdAt)}

        <br>

        <strong>Updated:</strong>
        ${formatDate(incident.updatedAt)}

    `;


    // Current responder
    if (incident.responderId) {

        document.getElementById("currentResponder").innerHTML = `

            <strong>
                ${escapeHTML(incident.responderName || "Responder")}
            </strong>

            <br><br>

            Responder ID:
            ${escapeHTML(incident.responderId)}

            <br><br>

            Status:
            ${escapeHTML(incident.status || "Assigned")}

        `;

    } else {

        document.getElementById("currentResponder").textContent =
            "No responder assigned.";

    }


    // Emergency location
    const lat = Number(incident.latitude);
    const lng = Number(incident.longitude);

    if (Number.isFinite(lat) && Number.isFinite(lng)) {

        document.getElementById("location").innerHTML = `

            Latitude: ${lat.toFixed(6)}

            <br>

            Longitude: ${lng.toFixed(6)}

        `;

        document.getElementById("mapBtn").onclick = () => {

            window.open(
                `https://www.google.com/maps?q=${lat},${lng}`,
                "_blank"
            );

        };

    } else {

        document.getElementById("location").textContent =
            "Location not available.";

        document.getElementById("mapBtn").disabled = true;

    }

}


// ------------------------------------
// LOAD APPROVED RESPONDERS
// ------------------------------------

function loadResponders() {

    onValue(
        ref(db, "users"),

        (snapshot) => {

            responders = [];

            snapshot.forEach((child) => {

                const data = child.val();

                const isAvailable =
                    data.available === true ||
                    data.status === "available";

                if (
                    data.role === "responder" &&
                    data.approved === true &&
                    isAvailable
                ) {

                    responders.push({
                        id: child.key,
                        ...data
                    });

                }

            });

            renderResponderOptions();

        },

        (error) => {

            console.error("Responder loading error:", error);

            responderSelect.innerHTML = `
                <option value="">
                    Unable to load responders
                </option>
            `;

        }
    );

}


function renderResponderOptions() {

    responderSelect.innerHTML = `
        <option value="">
            Select available responder
        </option>
    `;

    if (responders.length === 0) {

        responderSelect.innerHTML = `
            <option value="">
                No approved available responders
            </option>
        `;

        return;

    }

    responders.forEach((responder) => {

        const option = document.createElement("option");

        option.value = responder.id;

        option.textContent =
            `${responder.name || responder.email || "Responder"} — Available`;

        responderSelect.appendChild(option);

    });

}


// ------------------------------------
// ASSIGN RESPONDER THROUGH BACKEND API
// ------------------------------------

assignBtn.addEventListener("click", async () => {

    const responderId = responderSelect.value;

    message.textContent = "";
    message.style.color = "red";

    if (!responderId) {

        message.textContent =
            "Please select an available responder.";

        return;

    }

    const responder = responders.find(
        item => item.id === responderId
    );

    if (!responder) {

        message.textContent =
            "Selected responder is not available.";

        return;

    }

    if (!currentUser) {

        message.textContent =
            "Admin session expired. Please login again.";

        return;

    }

    try {

        assignBtn.disabled = true;
        assignBtn.textContent = "Assigning...";

        // Get Firebase authentication token
        const token = await currentUser.getIdToken();

        // Call backend assignment API
        const response = await fetch(
            `${API_BASE_URL}/incidents/${encodeURIComponent(incidentId)}/assign`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify({
                    responderId: responderId
                })
            }
        );

        // Read backend response
        const result = await response.json();

        if (!response.ok || result.success !== true) {

            throw new Error(
                result.message ||
                `Assignment failed. HTTP ${response.status}`
            );

        }

        message.style.color = "green";

        message.textContent =
            "✅ Responder assigned successfully.";

        // Update current responder display
        const assignedIncident = result.incident || {};

        document.getElementById("currentResponder").innerHTML = `

            <strong>
                ${escapeHTML(
                    assignedIncident.responderName ||
                    responder.name ||
                    responder.email ||
                    "Responder"
                )}
            </strong>

            <br><br>

            Responder ID:
            ${escapeHTML(
                assignedIncident.responderId || responderId
            )}

            <br><br>

            Status:
            ${escapeHTML(
                assignedIncident.status || "assigned"
            )}

        `;

        // Live incident listener will also refresh the page data.

    } catch (error) {

        console.error("Responder assignment error:", error);

        message.style.color = "red";

        message.textContent =
            error.message || "Unable to assign responder.";

    } finally {

        assignBtn.disabled = false;
        assignBtn.textContent = "Assign Responder";

    }

});


// ------------------------------------
// HELPERS
// ------------------------------------

function formatDate(value) {

    if (!value) return "Unknown";

    const date = new Date(value);

    return isNaN(date)
        ? "Unknown"
        : date.toLocaleString();

}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
