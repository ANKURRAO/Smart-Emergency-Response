
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Responders | Admin</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f1f5f9;color:#1e293b}
header{
background:#0f172a;color:white;padding:18px 6%;
display:flex;justify-content:space-between;align-items:center
}
main{max-width:1100px;margin:auto;padding:30px 20px}
.toolbar,.create-panel{
background:white;padding:22px;border-radius:12px;margin:20px 0;
box-shadow:0 4px 15px rgba(0,0,0,.05)
}
.create-panel h2{margin-top:0}
.form-grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px
}
input,select{
width:100%;padding:12px;border:1px solid #cbd5e1;
border-radius:8px;background:white
}
button{
border:0;padding:11px 16px;border-radius:8px;
cursor:pointer;font-weight:bold
}
.primary{background:#2563eb;color:white}
.back{background:#475569;color:white}
.map{background:#2563eb;color:white}
.grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:16px
}
.card{
background:white;padding:22px;border-radius:14px;
box-shadow:0 4px 15px rgba(0,0,0,.05)
}
.online{color:#15803d;font-weight:bold}
.offline{color:#dc2626;font-weight:bold}
.status{
display:inline-block;padding:5px 10px;border-radius:20px;
font-size:12px;background:#e2e8f0;color:#334155
}
.message{margin-top:12px;font-weight:bold}
.success{color:#15803d}
.error{color:#dc2626}
.section-heading{margin-top:35px}
@media(max-width:600px){
header{padding:16px 4%}
main{padding:20px 14px}
}
</style>
</head>

<body>

<header>
<strong>🚑 Responder Management</strong>
<button class="back" onclick="location.href='dashboard.html'">
Dashboard
</button>
</header>

<main>

<h1>Emergency Responders</h1>
<p>Create, manage and monitor emergency responders.</p>

<section class="create-panel">

<h2>➕ Create New Responder</h2>

<form id="createResponderForm">

<div class="form-grid">

<input id="name" type="text" placeholder="Full Name" required>

<input id="email" type="email" placeholder="Email Address" required>

<input id="password" type="password"
placeholder="Temporary Password (minimum 8 characters)"
minlength="8" required>

<input id="phone" type="tel" placeholder="Phone Number" required>

<select id="department" required>
<option value="">Select Department</option>
<option value="Police">Police</option>
<option value="Fire">Fire</option>
<option value="Medical">Medical</option>
<option value="Disaster Management">Disaster Management</option>
</select>

<input id="vehicle" type="text" placeholder="Vehicle / Unit">

</div>

<br>

<button class="primary" id="createBtn" type="submit">
Create Responder
</button>

<p id="formMessage" class="message" aria-live="polite"></p>

</form>
</section>

<section class="toolbar">

<h3>Filter Responders</h3>

<select id="availabilityFilter">
<option value="all">All Responders</option>
<option value="online">Available</option>
<option value="offline">Offline</option>
</select>

</section>

<h2 class="section-heading">Responder List</h2>

<section id="list" class="grid">
Loading responders...
</section>

</main>

<script type="module">

import {auth,db} from "../firebase-config.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
ref,get,onValue
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

let responders=[];
let currentUser=null;

const form=document.getElementById("createResponderForm");
const createBtn=document.getElementById("createBtn");
const formMessage=document.getElementById("formMessage");

onAuthStateChanged(auth,async(user)=>{

if(!user){
location.href="../index.html";
return;
}

try{

const profile=await get(ref(db,"users/"+user.uid));

if(!profile.exists() || profile.val().role!=="admin"){
alert("Admin access required.");
location.href="../index.html";
return;
}

currentUser=user;
loadResponders();

}catch(error){
console.error(error);
alert("Unable to verify admin access.");
}

});


form.addEventListener("submit",async(event)=>{

event.preventDefault();

if(!currentUser)return;

const responderData={

name:document.getElementById("name").value.trim(),
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value,
phone:document.getElementById("phone").value.trim(),
department:document.getElementById("department").value,
vehicle:document.getElementById("vehicle").value.trim()

};

if(responderData.password.length<8){
showMessage("Password must contain at least 8 characters.","error");
return;
}

createBtn.disabled=true;
createBtn.textContent="Creating...";
showMessage("Creating responder account...","");

try{

const token=await currentUser.getIdToken(true);

const response=await fetch(
"http://localhost:5000/api/admin/responders",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify(responderData)
}
);

const result=await response.json();

if(!response.ok){
throw new Error(result.message||result.error||"Unable to create responder.");
}

form.reset();

showMessage(
"Responder account created successfully.",
"success"
);

}catch(error){

console.error(error);
showMessage(error.message,"error");

}finally{

createBtn.disabled=false;
createBtn.textContent="Create Responder";

}

});


function showMessage(message,type){

formMessage.textContent=message;
formMessage.className="message "+type;

}


function loadResponders(){

onValue(
ref(db,"users"),
snapshot=>{

responders=[];

snapshot.forEach(child=>{

const data=child.val();

if(data.role==="responder"){

responders.push({
id:child.key,
...data
});

}

});

render();

},
error=>{

console.error("Responder loading error:",error);

document.getElementById("list").textContent=
"Unable to load responders. Check database permissions.";

}
);

}


document
.getElementById("availabilityFilter")
.addEventListener("change",render);


function render(){

const filter=
document.getElementById("availabilityFilter").value;

let list=responders;

if(filter==="online"){
list=responders.filter(r=>r.available===true);
}

if(filter==="offline"){
list=responders.filter(r=>r.available!==true);
}

const container=document.getElementById("list");

container.innerHTML="";

if(list.length===0){
container.textContent="No responders found.";
return;
}

list.forEach(r=>{

const card=document.createElement("div");
card.className="card";

const available=r.available===true;

const title=document.createElement("h2");
title.textContent=r.name||"Unnamed Responder";

const details=document.createElement("div");

[
["Email",r.email],
["Phone",r.phone],
["Department",r.department],
["Vehicle",r.vehicle],
["Approval",r.approved===true?"Approved":"Pending Approval"]
].forEach(([label,value])=>{

const p=document.createElement("p");
const strong=document.createElement("strong");
strong.textContent=label+": ";
p.append(strong,document.createTextNode(value||"Not specified"));
details.appendChild(p);

});

const status=document.createElement("p");
status.className=available?"online":"offline";
status.textContent=available?"● Available":"● Offline";

const mapButton=document.createElement("button");
mapButton.className="map";
mapButton.textContent="View Location";

mapButton.addEventListener("click",()=>{
openLocation(r.latitude,r.longitude);
});

card.append(title,details,status,mapButton);
container.appendChild(card);

});

}


function openLocation(lat,lng){

if(typeof lat!=="number"||typeof lng!=="number"){
alert("Responder location unavailable.");
return;
}

window.open(
"https://www.google.com/maps?q="+lat+","+lng,
"_blank",
"noopener,noreferrer"
);

}

</script>

</body>
</html>
